# Profil DEV : base H2 en mémoire, aucune installation requise.
# Actif par défaut (voir application.properties : spring.profiles.active).

# Initialisation de la base de donnees
# Assure que data.sql est execute APRES la creation des tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# H2 Configuration
# Active la console H2 (accessible sur http://localhost:9000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate gere la creation des tables (base recréée à chaque démarrage : H2 en mémoire)
spring.jpa.hibernate.ddl-auto=update

# Voir l'URL JDBC de H2 au demarrage
logging.level.org.springframework.boot.autoconfigure.h2=INFO

# Affichage SQL (Optionnel, debranche pour plus de clarte)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
