# Profil PROD : PostgreSQL. Activé via SPRING_PROFILES_ACTIVE=prod (voir docker-compose.yml).
#
# Volontairement AUCUNE valeur par défaut sur POSTGRES_PASSWORD (contrairement à
# JWT_SECRET qui a un défaut dev) : en prod, un identifiant de base de données ne
# doit jamais reposer sur une valeur devinable codée en dur. Si la variable d'env
# n'est pas définie, Spring Boot refuse de démarrer plutôt que de se rabattre
# silencieusement sur un mot de passe connu — fail fast, pas fail silencieux.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:doctolia}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate gere la creation/mise a jour des tables (pas de Flyway/Liquibase : hors
# périmètre de cette certification, ddl-auto=update suffit pour la démonstration).
spring.jpa.hibernate.ddl-auto=update

# Console H2 : inexistante en prod (pas de dépendance H2 chargée sur ce profil,
# spring.h2.console.enabled n'a de toute façon aucun effet sans driver H2 actif).

# SQL affiché en dev uniquement, jamais en prod (volumes de logs, perf)
spring.jpa.show-sql=false
